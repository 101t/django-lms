# Production stack: web + worker + scheduler + PostgreSQL + Redis + Caddy (automatic HTTPS).
# Configure with a `.env` file next to this one (install.sh writes it for you).
name: django-lms

x-app: &app
  image: ghcr.io/101t/django-lms:${LMS_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://lms:${POSTGRES_PASSWORD}@db:5432/lms
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    command: web

  worker:
    <<: *app
    command: worker
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *app
    command: beat
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
